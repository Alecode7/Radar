    <rect x="955" y="190" width="150" height="72" rx="13" fill="#6d28d9"/><text x="1030" y="220" text-anchor="middle" fill="#f5efff" font-size="15">心率候选</text><text x="1030" y="244" text-anchor="middle" fill="#ddd0ff" font-size="13">频谱 + 共识</text>
