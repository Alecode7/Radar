  <text x="55" y="435" fill="#86aebe" font-size="13" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">核心原则：motion负责进入和活动，micro负责静止保活与呼吸，IQ用于更细粒度生命体征分析。</text>
