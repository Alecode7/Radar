  <rect width="1200" height="470" rx="26" fill="url(#bg)"/>
  <text x="55" y="58" fill="#f7fbff" font-size="28" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">MRS6130 睡眠雷达核心算法链路</text>
  <text x="55" y="90" fill="#9fc6d8" font-size="15" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif">从雷达点云与复数IQ，到板端状态机和PC端心率候选</text>
